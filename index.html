<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Echo Pulse</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background: #08090d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #hud {
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: bold;
      display: flex;
      gap: 15px;
      align-items: center;
      background: #111420;
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid #00ffcc44;
      box-shadow: 0 0 15px rgba(0,255,204,0.1);
      z-index: 10;
    }

    /* Difficulty Toggle Buttons */
    .diff-container {
      display: flex;
      gap: 6px;
      margin-left: 10px;
    }
    .diff-btn {
      background: #1a1e2e;
      border: 1px solid #00ffcc66;
      color: #888;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .diff-btn.active {
      background: #00ffcc;
      color: #08090d;
      border-color: #00ffcc;
      box-shadow: 0 0 8px #00ffccaa;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      border: 2px solid #00ffcc44;
      box-shadow: 0 0 35px rgba(0, 255, 204, 0.12);
      background: #000;
      border-radius: 6px;
      max-width: 100%;
      max-height: 65vh;
      object-fit: contain;
      touch-action: none;
    }
    #msg {
      margin-top: 8px;
      font-size: 13px;
      color: #00ffcc;
      letter-spacing: 1px;
      text-align: center;
      padding: 0 15px;
      font-weight: 600;
    }

    /* Mobile Controls Container (Hidden on PC) */
    #mobile-controls {
      display: none;
      width: 100%;
      max-width: 800px;
      padding: 10px 30px;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      z-index: 20;
    }

    /* Analog Joystick Styling */
    #joystick-container {
      position: relative;
      width: 120px;
      height: 120px;
      background: rgba(17, 20, 32, 0.85);
      border: 3px solid #00ffcc;
      border-radius: 50%;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.3), inset 0 0 15px rgba(0, 255, 204, 0.15);
    }

    #joystick-thumb {
      position: absolute;
      width: 50px;
      height: 50px;
      background: #00ffcc;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 15px #00ffcc;
      pointer-events: none;
      transform: translate(0px, 0px);
      transition: transform 0.05s ease-out;
    }

    .joy-arrow {
      position: absolute;
      color: rgba(0, 255, 204, 0.6);
      font-size: 13px;
      font-weight: bold;
      pointer-events: none;
    }
    .joy-arrow.up { top: 5px; }
    .joy-arrow.down { bottom: 5px; }
    .joy-arrow.left { left: 7px; }
    .joy-arrow.right { right: 7px; }

    /* Pulse Action Button */
    .btn-pulse {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: rgba(255, 0, 127, 0.35);
      border: 3px solid #ff007f;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      cursor: pointer;
    }
    .btn-pulse:active {
      background: rgba(255, 0, 127, 0.8);
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.8);
    }
  </style>
</head>
<body>

  <div id="hud">
    <div>Crystals: <span id="crystals" style="color:#00ffcc">0</span> / 5</div>
    <div>Battery: <span id="battery" style="color:#ff007f">100</span>%</div>
    <div class="diff-container">
      <button class="diff-btn" id="btn-easy" onclick="setDifficulty('easy')">EASY</button>
      <button class="diff-btn active" id="btn-medium" onclick="setDifficulty('medium')">MED</button>
      <button class="diff-btn" id="btn-hard" onclick="setDifficulty('hard')">HARD</button>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
  </div>

  <div id="msg">🎮 CONTROLS: WASD / Arrow Keys to Move | SPACEBAR for Sonar Blast</div>

  <div id="mobile-controls">
    <div id="joystick-container">
      <span class="joy-arrow up">▲</span>
      <span class="joy-arrow down">▼</span>
      <span class="joy-arrow left">◀</span>
      <span class="joy-arrow right">▶</span>
      <div id="joystick-thumb"></div>
    </div>
    <div class="btn-pulse" id="btn-pulse">PULSE</div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Device Detection
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth <= 800);
const msgElem = document.getElementById('msg');
const mobileControlsElem = document.getElementById('mobile-controls');

// Speeds for Platforms
const PC_SPEED = 4.2;
const MOBILE_SPEED = 2.5;

let playerSpeed = isTouchDevice ? MOBILE_SPEED : PC_SPEED;

if (isTouchDevice) {
  msgElem.innerText = '📱 TOUCH CONTROLS: Drag Joystick to Move | Tap PULSE Button for Sonar';
  mobileControlsElem.style.display = 'flex';
} else {
  msgElem.innerText = '🎮 CONTROLS: WASD / Arrow Keys to Move | SPACEBAR for Sonar Blast';
  mobileControlsElem.style.display = 'none';
}

// Difficulty System Settings
const diffSettings = {
  easy:   { enemyCount: 6,  enemySpeedMin: 0.5, enemySpeedMax: 0.9, rechargeMoving: 0.18, rechargeIdle: 0.35 },
  medium: { enemyCount: 10, enemySpeedMin: 0.8, enemySpeedMax: 1.5, rechargeMoving: 0.12, rechargeIdle: 0.28 },
  hard:   { enemyCount: 15, enemySpeedMin: 1.3, enemySpeedMax: 2.2, rechargeMoving: 0.07, rechargeIdle: 0.18 }
};

let currentDiff = 'medium';

function setDifficulty(diff) {
  currentDiff = diff;
  document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`btn-${diff}`).classList.add('active');
  restartGame();
}

// Player Properties
let player = { x: 80, y: 80, radius: 9, vx: 0, vy: 0, battery: 100 };
let keys = {};
let joystickVector = { x: 0, y: 0 };
let crystalsCollected = 0;
let gameOver = false;
let gameWon = false;
let flashRed = false;
let particles = [];

// Audio Context
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContextClass();

function playSound(freq, type = 'sine', duration = 0.1) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

function unlockAudio() {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}
window.addEventListener('touchstart', unlockAudio, { passive: true });
window.addEventListener('click', unlockAudio, { passive: true });

// Maze Walls
const walls = [
  { x: 160, y: 0, w: 20, h: 360 },
  { x: 320, y: 140, w: 20, h: 360 },
  { x: 480, y: 0, w: 20, h: 360 },
  { x: 640, y: 140, w: 20, h: 360 },
  { x: 0, y: 0, w: 800, h: 10 },
  { x: 0, y: 490, w: 800, h: 10 },
  { x: 0, y: 0, w: 10, h: 500 },
  { x: 790, y: 0, w: 10, h: 500 }
];

// Crystal Generator
function generateRandomCrystals() {
  let list = [];
  while (list.length < 5) {
    let rx = Math.floor(Math.random() * 700) + 50;
    let ry = Math.floor(Math.random() * 400) + 50;

    let inWall = walls.some(w => 
      rx > w.x - 20 && rx < w.x + w.w + 20 &&
      ry > w.y - 20 && ry < w.y + w.h + 20
    );
    let nearStart = Math.hypot(rx - 80, ry - 80) < 120;

    if (!inWall && !nearStart) {
      list.push({ x: rx, y: ry, collected: false });
    }
  }
  return list;
}

let crystals = generateRandomCrystals();

// Enemy Generator
function createEnemies() {
  let cfg = diffSettings[currentDiff];
  let list = [];
  for (let i = 0; i < cfg.enemyCount; i++) {
    let ex = 200 + (i % 4) * 150 + Math.random() * 30;
    let ey = 80 + Math.floor(i / 4) * 120 + Math.random() * 30;
    let angle = Math.random() * Math.PI * 2;
    let spd = cfg.enemySpeedMin + Math.random() * (cfg.enemySpeedMax - cfg.enemySpeedMin); 
    list.push({
      x: ex, y: ey, radius: 6, 
      vx: Math.cos(angle) * spd, 
      vy: Math.sin(angle) * spd
    });
  }
  return list;
}

let enemies = createEnemies();
let pulses = [];

// Particle Explosion
function createCrystalExplosion(cx, cy) {
  for (let i = 0; i < 24; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = 1.5 + Math.random() * 3.5;
    particles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 3,
      alpha: 1,
      decay: 0.02 + Math.random() * 0.02,
      color: Math.random() > 0.3 ? '#00ffcc' : '#ffffff'
    });
  }
}

// Keyboard Listeners (PC)
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    if (gameOver || gameWon) {
      restartGame();
    } else {
      triggerBlast();
    }
  }
});
window.addEventListener('keyup', e => keys[e.code] = false);

// Touch Joystick Mechanics (Mobile Only)
if (isTouchDevice) {
  const joyContainer = document.getElementById('joystick-container');
  const joyThumb = document.getElementById('joystick-thumb');
  let joyTouchId = null;
  const maxRadius = 35;

  function handleJoystickMove(clientX, clientY) {
    const rect = joyContainer.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let deltaX = clientX - centerX;
    let deltaY = clientY - centerY;
    let dist = Math.hypot(deltaX, deltaY);

    if (dist > maxRadius) {
      deltaX = (deltaX / dist) * maxRadius;
      deltaY = (deltaY / dist) * maxRadius;
      dist = maxRadius;
    }

    joyThumb.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
    
    let normalizedDist = dist / maxRadius;
    if (normalizedDist < 0.12) {
      joystickVector = { x: 0, y: 0 };
    } else {
      let speedMult = (normalizedDist - 0.12) / 0.88;
      let angle = Math.atan2(deltaY, deltaX);
      joystickVector.x = Math.cos(angle) * speedMult;
      joystickVector.y = Math.sin(angle) * speedMult;
    }
  }

  function resetJoystick() {
    joyTouchId = null;
    joyThumb.style.transform = 'translate(0px, 0px)';
    joystickVector = { x: 0, y: 0 };
  }

  joyContainer.addEventListener('touchstart', e => {
    e.preventDefault();
    unlockAudio();
    if (gameOver || gameWon) { restartGame(); return; }
    if (joyTouchId === null && e.changedTouches.length > 0) {
      const touch = e.changedTouches[0];
      joyTouchId = touch.identifier;
      handleJoystickMove(touch.clientX, touch.clientY);
    }
  }, { passive: false });

  window.addEventListener('touchmove', e => {
    if (joyTouchId !== null) {
      for (let i = 0; i < e.touches.length; i++) {
        if (e.touches[i].identifier === joyTouchId) {
          handleJoystickMove(e.touches[i].clientX, e.touches[i].clientY);
          break;
        }
      }
    }
  }, { passive: true });

  window.addEventListener('touchend', e => {
    if (joyTouchId !== null) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          resetJoystick();
          break;
        }
      }
    }
  });

  const pulseBtn = document.getElementById('btn-pulse');
  pulseBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    unlockAudio();
    if (gameOver || gameWon) { restartGame(); return; }
    triggerBlast();
  }, { passive: false });
}

canvas.addEventListener('click', () => {
  unlockAudio();
  if (gameOver || gameWon) restartGame();
});

function restartGame() {
  player.x = 80;
  player.y = 80;
  player.battery = 100;
  crystalsCollected = 0;
  gameOver = false;
  gameWon = false;
  flashRed = false;
  pulses = [];
  particles = [];
  joystickVector = { x: 0, y: 0 };
  crystals = generateRandomCrystals();
  enemies = createEnemies();
}

function triggerBlast() {
  if (player.battery >= 10 && !gameOver && !gameWon) {
    player.battery -= 10;
    pulses.push({ x: player.x, y: player.y, radius: 8, maxRadius: 380, alpha: 1 });
    playSound(220, 'sawtooth', 0.18);

    enemies.forEach(e => {
      if (Math.hypot(e.x - player.x, e.y - player.y) < 200) {
        let angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.vx = Math.cos(angle) * 1.2;
        e.vy = Math.sin(angle) * 1.2;
      }
    });
  }
}

// Wall Collision Detector
function checkWallCollision(px, py, radius) {
  return walls.some(w => 
    px + radius > w.x && px - radius < w.x + w.w &&
    py + radius > w.y && py - radius < w.y + w.h
  );
}

function update() {
  if (gameOver || gameWon) return;

  let isMoving = false;
  let moveX = 0;
  let moveY = 0;

  // Keyboard Movement
  if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

  if (moveX !== 0 && moveY !== 0) {
    moveX *= 0.7071;
    moveY *= 0.7071;
  }

  // Joystick Movement
  if (joystickVector.x !== 0 || joystickVector.y !== 0) {
    moveX = joystickVector.x;
    moveY = joystickVector.y;
  }

  player.vx = moveX * playerSpeed;
  player.vy = moveY * playerSpeed;

  if (player.vx !== 0 || player.vy !== 0) isMoving = true;

  // X Axis Movement
  let tryX = player.x + player.vx;
  if (!checkWallCollision(tryX, player.y, player.radius)) {
    player.x = tryX;
  }

  // Y Axis Movement
  let tryY = player.y + player.vy;
  if (!checkWallCollision(player.x, tryY, player.radius)) {
    player.y = tryY;
  }

  // Battery Recharge
  let cfg = diffSettings[currentDiff];
  if (player.battery < 100) {
    player.battery += isMoving ? cfg.rechargeMoving : cfg.rechargeIdle;
    if (player.battery > 100) player.battery = 100;
  }

  // Pulse Propagation
  pulses.forEach((p, idx) => {
    p.radius += 5;
    p.alpha -= 0.012;
    if (p.alpha <= 0) pulses.splice(idx, 1);
  });

  // Particle Updates
  particles.forEach((pt, idx) => {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.alpha -= pt.decay;
    if (pt.alpha <= 0) particles.splice(idx, 1);
  });

  // Crystal Collection
  crystals.forEach(c => {
    if (!c.collected && Math.hypot(player.x - c.x, player.y - c.y) < player.radius + 8) {
      c.collected = true;
      crystalsCollected++;
      createCrystalExplosion(c.x, c.y);
      let note = 440 + (crystalsCollected * 100);
      playSound(note, 'sine', 0.2);
      if (crystalsCollected === 5) {
        gameWon = true;
        playSound(880, 'sine', 0.4);
      }
    }
  });

  // Enemy Movement & Hit Detection
  enemies.forEach(e => {
    e.x += e.vx;
    e.y += e.vy;

    walls.forEach(w => {
      if (e.x + e.radius > w.x && e.x - e.radius < w.x + w.w) e.vx *= -1;
      if (e.y + e.radius > w.y && e.y - e.radius < w.y + w.h) e.vy *= -1;
    });

    if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
      gameOver = true;
      flashRed = true;
      playSound(90, 'sawtooth', 0.35);
      setTimeout(() => flashRed = false, 250);
    }
  });

  document.getElementById('crystals').innerText = crystalsCollected;
  document.getElementById('battery').innerText = Math.floor(player.battery);
}

function draw() {
  ctx.fillStyle = flashRed ? 'rgba(255, 0, 50, 0.4)' : '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  pulses.forEach(p => {
    ctx.strokeStyle = `rgba(0, 255, 204, ${p.alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.stroke();

    walls.forEach(w => {
      let dx = Math.max(w.x, Math.min(p.x, w.x + w.w)) - p.x;
      let dy = Math.max(w.y, Math.min(p.y, w.y + w.h)) - p.y;
      if (Math.hypot(dx, dy) < p.radius) {
        ctx.fillStyle = `rgba(130, 40, 220, ${p.alpha * 0.9})`;
        ctx.fillRect(w.x, w.y, w.w, w.h);
      }
    });

    crystals.forEach(c => {
      if (!c.collected && Math.hypot(c.x - p.x, c.y - p.y) < p.radius) {
        ctx.fillStyle = `rgba(0, 255, 204, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 7, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    enemies.forEach(e => {
      if (Math.hypot(e.x - p.x, e.y - p.y) < p.radius) {
        ctx.fillStyle = `rgba(255, 0, 127, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  });

  // Render Explosion Particles
  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = Math.max(0, pt.alpha);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;

  // Render Player
  ctx.fillStyle = '#00ffcc';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#00ffcc';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Overlays
  if (gameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff007f';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SWARM OVERRUN - GAME OVER', canvas.width / 2, 230);
    ctx.font = '15px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('Click screen or press Space / Keys to restart!', canvas.width / 2, 275);
  } else if (gameWon) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ffcc';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ABYSS ESCAPED - VICTORY!', canvas.width / 2, 230);
    ctx.font = '15px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('All 5 crystals collected successfully!', canvas.width / 2, 270);
    ctx.fillText('Click screen or press Space / Keys to play again!', canvas.width / 2, 300);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
