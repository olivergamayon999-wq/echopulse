<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Echo Pulse - Final Presentation Build</title>
  <style>
    body {
      margin: 0;
      background: #08090d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #hud {
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      gap: 30px;
      background: #111420;
      padding: 10px 25px;
      border-radius: 8px;
      border: 1px solid #00ffcc44;
      box-shadow: 0 0 15px rgba(0,255,204,0.1);
    }
    canvas {
      border: 2px solid #00ffcc44;
      box-shadow: 0 0 35px rgba(0, 255, 204, 0.12);
      background: #000;
      border-radius: 6px;
    }
    #msg {
      margin-top: 12px;
      font-size: 13px;
      color: #00ffcc;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div id="hud">
    <div>Crystals: <span id="crystals" style="color:#00ffcc">0</span> / 5</div>
    <div>Battery: <span id="battery" style="color:#ff007f">100</span>%</div>
  </div>

  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div id="msg">🎮 CONTROLS: WASD / Arrow Keys to Move | SPACEBAR for Sonar Blast (Stand still to recharge battery faster)</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let player = { x: 80, y: 80, radius: 10, vx: 0, vy: 0, speed: 3.5, battery: 100 };
let keys = {};
let crystalsCollected = 0;
let gameOver = false;
let gameWon = false;
let flashRed = false;

// Audio Context (Web Audio API)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type = 'sine', duration = 0.1) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

// Fixed Maze Map
const walls = [
  { x: 160, y: 0, w: 20, h: 360 },
  { x: 320, y: 140, w: 20, h: 360 },
  { x: 480, y: 0, w: 20, h: 360 },
  { x: 640, y: 140, w: 20, h: 360 },
  { x: 0, y: 0, w: 800, h: 10 },
  { x: 0, y: 490, w: 800, h: 10 },
  { x: 0, y: 0, w: 10, h: 500 },
  { x: 790, y: 0, w: 10, h: 500 }
];

// Randomized Crystal Generator
function generateRandomCrystals() {
  let list = [];
  while (list.length < 5) {
    let rx = Math.floor(Math.random() * 700) + 50;
    let ry = Math.floor(Math.random() * 400) + 50;

    let inWall = walls.some(w => 
      rx > w.x - 20 && rx < w.x + w.w + 20 &&
      ry > w.y - 20 && ry < w.y + w.h + 20
    );
    let nearStart = Math.hypot(rx - 80, ry - 80) < 120;

    if (!inWall && !nearStart) {
      list.push({ x: rx, y: ry, collected: false });
    }
  }
  return list;
}

let crystals = generateRandomCrystals();

// Generate "Balanced Swarm" - 12 Small Pink Orbs
let enemies = [];
for (let i = 0; i < 12; i++) {
  let ex = 200 + (i % 4) * 150 + Math.random() * 40;
  let ey = 80 + Math.floor(i / 4) * 120 + Math.random() * 40;
  let angle = Math.random() * Math.PI * 2;
  let spd = 1.2 + Math.random() * 0.8; 
  enemies.push({
    x: ex, y: ey, radius: 6, 
    vx: Math.cos(angle) * spd, 
    vy: Math.sin(angle) * spd
  });
}

let pulses = [];

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') triggerBlast();
});
window.addEventListener('keyup', e => keys[e.code] = false);

function triggerBlast() {
  if (player.battery >= 15 && !gameOver && !gameWon) {
    player.battery -= 15;
    pulses.push({ x: player.x, y: player.y, radius: 8, maxRadius: 400, alpha: 1 });
    playSound(200, 'sawtooth', 0.2);

    // AI Reacts: nearby enemies turn slightly towards pulse!
    enemies.forEach(e => {
      if (Math.hypot(e.x - player.x, e.y - player.y) < 220) {
        let angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.vx = Math.cos(angle) * 1.3;
        e.vy = Math.sin(angle) * 1.3;
      }
    });
  }
}

function update() {
  if (gameOver || gameWon) return;

  // Movement
  let isMoving = false;
  player.vx = 0; player.vy = 0;

  if (keys['KeyW'] || keys['ArrowUp']) { player.vy = -player.speed; isMoving = true; }
  if (keys['KeyS'] || keys['ArrowDown']) { player.vy = player.speed; isMoving = true; }
  if (keys['KeyA'] || keys['ArrowLeft']) { player.vx = -player.speed; isMoving = true; }
  if (keys['KeyD'] || keys['ArrowRight']) { player.vx = player.speed; isMoving = true; }

  let nextX = player.x + player.vx;
  let nextY = player.y + player.vy;

  // Wall collisions
  walls.forEach(w => {
    if (nextX + player.radius > w.x && nextX - player.radius < w.x + w.w &&
        nextY + player.radius > w.y && nextY - player.radius < w.y + w.h) {
      nextX = player.x;
      nextY = player.y;
    }
  });

  player.x = nextX;
  player.y = nextY;

  // Battery Recharge Logic (Recharges faster when standing still)
  if (player.battery < 100) {
    player.battery += isMoving ? 0.08 : 0.22;
    if (player.battery > 100) player.battery = 100;
  }

  // Pulses
  pulses.forEach((p, idx) => {
    p.radius += 5.5;
    p.alpha -= 0.012;
    if (p.alpha <= 0) pulses.splice(idx, 1);
  });

  // Collect Crystals
  crystals.forEach(c => {
    if (!c.collected && Math.hypot(player.x - c.x, player.y - c.y) < player.radius + 8) {
      c.collected = true;
      crystalsCollected++;
      let note = 400 + (crystalsCollected * 120);
      playSound(note, 'sine', 0.2);
      if (crystalsCollected === 5) {
        gameWon = true;
        playSound(880, 'sine', 0.5);
      }
    }
  });

  // Swarm AI Movement & Collisions
  enemies.forEach(e => {
    e.x += e.vx;
    e.y += e.vy;

    walls.forEach(w => {
      if (e.x + e.radius > w.x && e.x - e.radius < w.x + w.w) e.vx *= -1;
      if (e.y + e.radius > w.y && e.y - e.radius < w.y + w.h) e.vy *= -1;
    });

    if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
      gameOver = true;
      flashRed = true;
      playSound(80, 'sawtooth', 0.4);
      setTimeout(() => flashRed = false, 300);
    }
  });

  document.getElementById('crystals').innerText = crystalsCollected;
  document.getElementById('battery').innerText = Math.floor(player.battery);
}

function draw() {
  ctx.fillStyle = flashRed ? 'rgba(255, 0, 50, 0.4)' : '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Sonar Wave Illumination
  pulses.forEach(p => {
    ctx.strokeStyle = `rgba(0, 255, 204, ${p.alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.stroke();

    walls.forEach(w => {
      let dx = Math.max(w.x, Math.min(p.x, w.x + w.w)) - p.x;
      let dy = Math.max(w.y, Math.min(p.y, w.y + w.h)) - p.y;
      if (Math.hypot(dx, dy) < p.radius) {
        ctx.fillStyle = `rgba(130, 40, 220, ${p.alpha * 0.9})`;
        ctx.fillRect(w.x, w.y, w.w, w.h);
      }
    });

    crystals.forEach(c => {
      if (!c.collected && Math.hypot(c.x - p.x, c.y - p.y) < p.radius) {
        ctx.fillStyle = `rgba(0, 255, 204, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 7, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    enemies.forEach(e => {
      if (Math.hypot(e.x - p.x, e.y - p.y) < p.radius) {
        ctx.fillStyle = `rgba(255, 0, 127, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  });

  // Player
  ctx.fillStyle = '#00ffcc';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#00ffcc';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Win/Loss Overlay
  if (gameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff007f';
    ctx.font = 'bold 34px sans-serif';
    ctx.fillText('SWARM OVERRUN - GAME OVER', 150, 240);
    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('Refresh page (F5) to restart with new crystal locations!', 200, 280);
  } else if (gameWon) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ffcc';
    ctx.font = 'bold 34px sans-serif';
    ctx.fillText('ABYSS ESCAPED - VICTORY!', 180, 240);
    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('All 5 randomized crystals collected successfully!', 210, 280);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
